<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AnimeX Contact</title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Google Font -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      background:#0f0f0f;

      color:white;

      overflow-x:hidden;
    }

    /* =========================
    CONTACT SECTION
    ========================= */

    .contact-page{

      min-height:100vh;

      display:flex;

      align-items:center;

      padding:60px 0;
    }

    .contact-box{

      background:#151515;

      border-radius:30px;

      padding:50px;

      border:1px solid rgba(255,255,255,0.08);

      box-shadow:0 0 30px rgba(255,217,61,0.08);
    }

    /* TITLE */

    .contact-title{

      text-align:center;

      margin-bottom:50px;
    }

    .contact-title h1{

      font-size:3rem;

      font-weight:700;

      color:#FFD93D;
    }

    .contact-title p{

      color:#aaa;

      margin-top:10px;
    }

    /* CONTACT ITEMS */

    .contact-item{

      background:#1B1B1B;

      border-radius:20px;

      padding:25px;

      margin-bottom:20px;

      display:flex;

      align-items:center;

      gap:20px;

      transition:0.4s;

      border:1px solid transparent;
    }

    .contact-item:hover{

      transform:translateY(-5px);

      border-color:#FFD93D;

      box-shadow:0 0 25px rgba(255,217,61,0.2);
    }

    /* ICON */

    .contact-icon{

      width:70px;
      height:70px;

      background:#FF2E2E;

      border-radius:20px;

      display:flex;

      justify-content:center;
      align-items:center;

      font-size:1.8rem;

      flex-shrink:0;
    }

    /* TEXT */

    .contact-info h3{

      font-size:1.3rem;

      margin-bottom:5px;
    }

    .contact-info p{

      margin:0;

      color:#aaa;
    }

    /* WHATSAPP BUTTON */

    .whatsapp-btn{

      width:100%;

      margin-top:30px;

      background:#25D366;

      border:none;

      padding:18px;

      border-radius:18px;

      font-size:1.1rem;

      font-weight:600;

      color:white;

      transition:0.4s;

      text-decoration:none;

      display:flex;

      justify-content:center;

      align-items:center;

      gap:12px;
    }

    .whatsapp-btn:hover{

      transform:translateY(-4px);

      background:#1ebe5d;

      color:white;
    }

    /* SOCIALS */

    .social-links{

      margin-top:40px;

      display:flex;

      justify-content:center;

      gap:20px;
    }

    .social-links a{

      width:55px;
      height:55px;

      background:#1B1B1B;

      border-radius:50%;

      display:flex;

      justify-content:center;
      align-items:center;

      color:white;

      font-size:1.3rem;

      transition:0.4s;

      text-decoration:none;
    }

    .social-links a:hover{

      background:#FFD93D;

      color:black;

      transform:translateY(-5px);
    }

    /* MOBILE */

    @media(max-width:768px){

      .contact-box{
        padding:30px 20px;
      }

      .contact-title h1{
        font-size:2rem;
      }

      .contact-item{

        flex-direction:column;

        text-align:center;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
  CONTACT PAGE
  ========================= -->

  <section class="contact-page">

    <div class="container">

      <div class="contact-box">

        <!-- TITLE -->

        <div class="contact-title">

          <h1>Contact AnimeX</h1>

          <p>
            Connect with us through any platform
          </p>

        </div>

        <!-- EMAIL -->

        <div class="contact-item">

          <div class="contact-icon">

            <i class="bi bi-envelope-fill"></i>

          </div>

          <div class="contact-info">

            <h3>Email</h3>

            <p>support@animex.com</p>

          </div>

        </div>

        <!-- INSTAGRAM -->

        <div class="contact-item">

          <div class="contact-icon">

            <i class="bi bi-instagram"></i>

          </div>

          <div class="contact-info">

            <h3>Instagram</h3>

            <p>@animex.store</p>

          </div>

        </div>

        <!-- DISCORD -->

        <div class="contact-item">

          <div class="contact-icon">

            <i class="bi bi-discord"></i>

          </div>

          <div class="contact-info">

            <h3>Discord</h3>

            <p>AnimeX Community</p>

          </div>

        </div>

        <!-- PHONE -->

        <div class="contact-item">

          <div class="contact-icon">

            <i class="bi bi-telephone-fill"></i>

          </div>

          <div class="contact-info">

            <h3>Phone</h3>

            <p>+91 9999999999</p>

          </div>

        </div>

        <!-- WHATSAPP -->

        <a
          href="https://wa.me/919999999999"
          target="_blank"
          class="whatsapp-btn"
        >

          <i class="bi bi-whatsapp"></i>

          Chat On WhatsApp

        </a>

        <!-- SOCIAL LINKS -->

        <div class="social-links">

          <a href="#">
            <i class="bi bi-facebook"></i>
          </a>

          <a href="#">
            <i class="bi bi-instagram"></i>
          </a>

          <a href="#">
            <i class="bi bi-twitter-x"></i>
          </a>

          <a href="#">
            <i class="bi bi-youtube"></i>
          </a>

        </div>

      </div>

    </div>

  </section>

</body>

</html>
